name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14", "3.14t"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ matrix.python }}"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked ty check
      - name: Test with coverage
        run: uv run --locked pytest --cov=ploom --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: tests
          name: ${{ matrix.os }}-python-${{ matrix.python }}
          fail_ci_if_error: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Preserve model-checking counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ploom-traces-${{ matrix.os }}-${{ matrix.python }}
          path: .ploom/
          include-hidden-files: true
          if-no-files-found: ignore

  documentation:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          enable-cache: true
      - name: Build strict MkDocs site
        run: uv run --locked --group docs mkdocs build --strict
      - name: Upload rendered documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  publish-documentation:
    name: Publish documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, documentation]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
