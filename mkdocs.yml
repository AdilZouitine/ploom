site_name: ploom
site_description: Find thread bugs and replay the failure.
site_url: https://adilzouitine.github.io/ploom/
repo_url: https://github.com/AdilZouitine/ploom
repo_name: AdilZouitine/ploom
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Start here: index.md
  - Checking and replay: guide.md
  - Guarantees: semantics.md
  - Python API: api.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            inherited_members: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
